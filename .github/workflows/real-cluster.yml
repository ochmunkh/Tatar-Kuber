# Live Mode B-г БОДИТ cluster дээр батлах: kind cluster босгож, зориудаар эмзэг
# workload deploy хийж, жинхэнэ scanner-уудыг ажиллуулж, tatar-kuber-ээр live scan хийнэ.
# Гараар ажиллуулна (workflow_dispatch); тайланг artifact болгож хадгална.
name: Real cluster (kind)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # ӨДӨР ТУТАМ — live флагууд эвдрээгүйг хянана.
      # 7 хоног тутам байсныг өдөр тутам болгов: GitHub-ын хуваарьт ажиллалт
      # ачаалалтай үед саатах/алгасагдах боломжтой, мөн repo 60 хоног commit-гүй
      # бол автоматаар идэвхгүй болдог. Өдөр тутам бол алгасалт нэг өдрөөс
      # хэтрэхгүй, kind cluster 2 минут тул үнэ багатай.
  push:
    branches: [master, main]
    paths: # scanner флаг/парсер өөрчлөгдвөл бодит cluster дээр шууд шалгана
      - "internal/scanner/**"
      - "internal/orchestrator/**"
      - "schema/canonical-controls.yaml"
      - ".github/workflows/real-cluster.yml"

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true

      - name: Build tatar-kuber
        run: go build -o tatar-kuber ./cmd/tatar-kuber

      - name: Create kind cluster
        uses: helm/kind-action@0025e74a8c7512023d06dc019c617aa3cf561fde # v1.10.0 (v1.10.0)
        with:
          cluster_name: tatar-demo

      - name: Deploy intentionally-vulnerable workloads
        run: |
          kubectl create namespace demo --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n demo -f examples/vulnerable/
          kubectl get all -n demo

      # Суулгагчид нь upstream-ийн сүлжээнээс хамаарна. 2026-09-18-нд Kubescape-ийн
      # install.sh түр зуурын саатлаар exit 1 өгч, БҮХЭЛ run унаж, doctor ба
      # "scanner бүр finding өгсөн эсэх" шалгалт огт ажиллаагүй. Тиймээс:
      #   1) суулгалт бүрийг 3 удаа дахин оролдоно;
      #   2) эцэст нь бүтэхгүй бол алхам алдаатай гэж тэмдэглэгдэнэ (шар), гэхдээ
      #      run үргэлжилнэ — scanner нь scanner_runs-д "unavailable" гэж гарч,
      #      үлдсэн scanner-ууд шалгагдаж, тайлан artifact болж хадгалагдана.
      # Ингэснээр суулгагчийн флюк ба scanner ЖИНХЭНЭ эвдэрсэн хоёр ялгарна.
      - name: Install Trivy
        run: |
          for i in 1 2 3; do
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin && exit 0
            echo "::warning::trivy суулгалт $i дэх оролдлого амжилтгүй — дахин оролдоно"; sleep 5
          done
          exit 1
        continue-on-error: true

      - name: Install Kubescape
        run: |
          # -f ЗААВАЛ: үгүй бол 404 буцаахад HTML хуудсыг шууд bash-д дамжуулна.
          for i in 1 2 3; do
            if curl -sfL https://raw.githubusercontent.com/kubescape/kubescape/master/install.sh | /bin/bash; then
              echo "$HOME/.kubescape/bin" >> "$GITHUB_PATH"; exit 0
            fi
            echo "::warning::kubescape суулгалт $i дэх оролдлого амжилтгүй — дахин оролдоно"; sleep 5
          done
          exit 1
        continue-on-error: true

      - name: Install Popeye
        run: |
          for i in 1 2 3; do
            VER="$(curl -s https://api.github.com/repos/derailed/popeye/releases/latest | grep -o '"tag_name": *"[^"]*"' | head -1 | sed -E 's/.*"v?([^"]+)".*/\1/')"
            if [ -n "$VER" ] \
              && curl -sfL "https://github.com/derailed/popeye/releases/download/v${VER}/popeye_linux_amd64.tar.gz" -o /tmp/popeye.tgz \
              && tar -xzf /tmp/popeye.tgz -C /tmp popeye; then
              sudo install -m0755 /tmp/popeye /usr/local/bin/popeye; exit 0
            fi
            echo "::warning::popeye суулгалт $i дэх оролдлого амжилтгүй — дахин оролдоно"; sleep 5
          done
          exit 1
        continue-on-error: true # popeye нэмэлт — суулгаж чадахгүй бол алгасна

      - name: Doctor — which scanners are live
        run: ./tatar-kuber doctor

      - name: Live scan (Mode B) on namespace demo
        run: |
          CTX="$(kubectl config current-context)"
          echo "context: $CTX"
          ./tatar-kuber scan \
            --kubeconfig "$HOME/.kube/config" \
            --context "$CTX" \
            --namespace demo \
            --cluster kind-demo \
            -o out
          echo "----- summary -----"
          ./tatar-kuber report --input out/scan-result.json -o json | grep -E '"risk_score"|"total_findings"|"scan_mode"' || true

      # Хоёр хэлийг НЭГ scan-аас гаргана — `report --lang`-ийг бодитоор шалгах
      # цорын ганц арга нь ашиглах. Хэрэв registry-д mn орчуулга дутвал эсвэл
      # ApplyLang эвдэрвэл энд илэрнэ.
      - name: Reports (HTML + SARIF, en + mn)
        run: |
          ./tatar-kuber report --input out/scan-result.json -o html  --out out/report.html
          ./tatar-kuber report --input out/scan-result.json -o html --lang mn --out out/report-mn.html
          ./tatar-kuber report --input out/scan-result.json -o sarif --out out/tatar-kuber.sarif
          grep -q '<html lang="en">' out/report.html
          grep -q '<html lang="mn">' out/report-mn.html

      - name: Upload live scan artifacts (report + raw scanner output as evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-scan-report
          path: out/

      # SCANNER ТУС БҮРИЙГ шалгана. v1.0.0-д "нийт ≥1" гэсэн сул шалгалт байсан тул
      # Trivy/Popeye 0 finding өгч байхад (AVD ID формат, --report summary) CI ногоон байсан.
      - name: Assert EVERY available scanner produced findings
        run: |
          echo "----- scanner_runs -----"
          jq -r '.metadata.scanner_runs[] | "\(.scanner)\t\(.status)\tfindings=\(.findings)\tunmapped=\(.unmapped_count // 0)\t\(.error // "")"' out/scan-result.json
          FAIL=0
          for s in trivy kubescape popeye; do
            ST="$(jq -r --arg s "$s" '.metadata.scanner_runs[] | select(.scanner==$s) | .status' out/scan-result.json)"
            N="$(jq -r --arg s "$s" '.metadata.scanner_runs[] | select(.scanner==$s) | .findings' out/scan-result.json)"
            if [ "$ST" = "unavailable" ]; then
              echo "::warning::$s суугаагүй — алгасав"; continue
            fi
            if [ "$ST" != "ok" ] || [ "${N:-0}" -lt 1 ]; then
              echo "::error::$s: status=$ST findings=${N:-0} — live Mode B-д энэ scanner finding өгөх ЁСТОЙ (эмзэг workload deploy хийгдсэн)"
              FAIL=1
            fi
          done
          # Trivy заавал privileged (TATAR-CON-001)-ийг олох ёстой — бодит AVD ID формат зөв тайлагдаж буйн баталгаа.
          if ! jq -e '.findings[] | select(.canonical_control=="TATAR-CON-001") | select(.found_by | index("trivy"))' out/scan-result.json >/dev/null; then
            echo "::error::Trivy TATAR-CON-001 (privileged)-ийг илрүүлээгүй — AVD ID зураглал эвдэрсэн байж болзошгүй"
            FAIL=1
          fi
          # Хамгийн багадаа 2 scanner нэг л finding дээр санал нийлсэн байх (dedup ажиллаж буйн баталгаа).
          if ! jq -e '[.findings[] | select((.found_by | length) >= 2)] | length > 0' out/scan-result.json >/dev/null; then
            echo "::error::Ямар ч finding 2+ scanner-ээр батлагдаагүй — dedup/resource нэршил зөрсөн байж болзошгүй"
            FAIL=1
          fi
          exit $FAIL

      - name: Gate (informational)
        continue-on-error: true
        run: ./tatar-kuber gate --input out/scan-result.json --fail-on high
# workflow-registration: repo re-created 2026-09-08
