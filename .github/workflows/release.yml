name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # GitHub Release үүсгэх
  packages: write # ghcr.io руу image түлхэх

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changelog-д бүх түүх хэрэгтэй

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Homebrew tap руу бичихэд ochmunkh/homebrew-tap дээр эрхтэй PAT:
          # repo secret HOMEBREW_TAP_TOKEN нэмнэ. Байхгүй бол brew алхам алгасагдана.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
