name: Release

on:
  push:
    tags:
      # ЗӨВХӨН бүтэн хувилбарын tag. Хөдөлгөөнт `v1` tag ЭНД ТААРАХ ЁСГҮЙ.
      #
      # 2026-09-27: "v*" байсан тул `v1`-ийг v1.0.3 руу шилжүүлэхэд энэ workflow
      # хөөрч, goreleaser ажилласан. `v1` нь v1.0.3-тай нэг commit дээр байдаг
      # тул goreleaser хувилбарыг 1.0.3 гэж тооцоод v1.0.3-ийн release рүү
      # (release-id 397624878) хандсан: mode:replace тул эхлээд гарчиг, хоёр хэлт
      # тайлбарыг template-ээр ДАРЖ БИЧЭЭД, дараа нь 7 asset-ыг дахин байршуулж
      # чадалгүй (422 already_exists) унасан.
      #
      # `v1`-ийг шилжүүлэх нь release журмын хэсэг (README-д GitHub Action-д v1
      # гэж бичсэн) тул энэ нь release БҮРТ давтагдах урхи байв — release ногоон
      # харагдсаар байгаад тайлбар нь чимээгүй арилна.
      #
      # v1.0.3 ✅   v1.0.0-rc1 ✅   v1 ❌
      - "v[0-9]+.[0-9]+.[0-9]+*"

# ГУРВАДАГЧ ЭТГЭЭДИЙН ACTION-УУД COMMIT SHA-ГААР ПИННЭГДСЭН.
#
# Энэ ажил нь contents:write ба packages:write эрхтэй ажиллаж, хэрэглэгчийн
# татаж ажиллуулах binary-г нийтэлдэг. Tag бол ХӨДӨЛГӨӨНТ заагч: action-ы
# эзэмшигч (эсвэл түүний бүртгэлийг эзэмдсэн хүн) v6-г өөр commit руу зөөхөд
# дараагийн release тэр кодыг ажиллуулна. Онолын биш: 2025 оны 3-р сард
# tj-actions/changed-files дээр яг ийм байдлаар мянга мянган repo-гийн нууц
# алдагдсан.
#
# Яагаад энэ төсөлд ялангуяа чухал вэ: checksums.txt ба SBOM-ыг ЯГ ЭНЭ
# алхмууд үүсгэдэг. Эвдэрсэн goreleaser нь backdoor-той binary-д ТААРСАН
# checksum, SBOM гаргана — өөрөөр хэлбэл бидний бүрэн бүтэн байдлын
# хяналтууд үүнийг барихгүй. Checksum тулгасан хэрэглэгч 'зөв' гэж үзнэ.
#
# ЗАРДАЛ: SHA-д пиннэх нь аюулгүй байдлын засварыг ч зогсооно. Тиймээс
# .github/dependabot.yml нь эдгээрийг долоо хоног тутам шалгаж, шинэчлэлтийг
# PR болгон ирүүлнэ — пин нь хуучирвал хүн харна, чимээгүй хоцрохгүй.
#
# actions/* ба github/codeql-action нь GitHub-ийн өөрийнх тул major tag-аар
# үлдээв: тэднийг эзэмдэх нь өөр, илүү том ангиллын халдлага.
permissions:
  contents: write # GitHub Release үүсгэх
  packages: write # ghcr.io руу image түлхэх

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changelog-д бүх түүх хэрэгтэй

      - uses: actions/setup-go@v5
        with:
          go-version: "stable" # patched stdlib (html/template XSS засварууд)
          cache: true

      # goreleaser-ийн sboms: хэсэг syft-ээр ажиллана; байхгүй бол release унана.
      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0 (v0.24.x)

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3 (v3.6.0)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6 (v6.4.0 үеийн commit)
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Homebrew tap руу бичихэд ochmunkh/homebrew-tap дээр эрхтэй PAT:
          # repo secret HOMEBREW_TAP_TOKEN нэмнэ. Байхгүй бол brew алхам алгасагдана.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
# workflow-registration: repo re-created 2026-09-08
