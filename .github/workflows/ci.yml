name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "stable" # patched stdlib (html/template XSS засварууд)
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      # CONTRIBUTING.md-д setup ба adapter нэмэх алхам хоёуланд шаардлагатай гэж
      # бичигдсэн байсан ч ямар ч workflow ажиллуулдаггүй байв → хэзээ ч
      # мөрдөгддөггүй шаардлага. Registry бол canonical гэрээ тул үргэлж шалгана.
      - name: Validate canonical registry
        run: python3 scripts/validate_registry.py

      # The .docx and the .md of each engineering document are BOTH committed
      # and either one may be edited (CONTRIBUTING.md), so the pair has to be
      # back in sync before merge. Checked by CONTENT — regenerate the Markdown
      # and compare — never by modification time: git does not store
      # timestamps, so after a fresh clone every file carries the checkout time
      # and an mtime comparison would pass or fail at random. Content also
      # catches the case that matters, a .md edited by hand.
      - name: Docs in sync (.docx -> .md)
        run: bash scripts/docs.sh --check

  # Windows дээр бас ажиллах ёстой.
  #
  # ЯАГААД: бүх workflow ubuntu-latest дээр явдаг байсан тул 2026-10-14-ных
  # байдлаар master дээр `go test ./...` нь Windows дээр хоёр багц дээр унаж
  # байсныг CI мэдээгүй. GoReleaser Windows хоёрлог гаргадаг, бас зохиогч нь
  # өөрөө Windows дээр ажилладаг — харагдахгүй байсан нь зөвхөн CI.
  build-test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # gosec SARIF-ийг Code Scanning руу upload
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "stable" # patched stdlib (html/template XSS засварууд)
          cache: true

      # Хамааралууд болон stdlib дахь мэдэгдэж буй CVE-г шалгана (нарийвчлалтай).
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      # Статик аюулгүй байдлын шинжилгээ (SAST). CI-г унагахгүй — үр дүнг Code Scanning-д мэдээлнэ.
      - name: gosec (SAST)
        uses: securego/gosec@c9453023c4e81ebdb6dde29e22d9cd5e2285fb16 # v2.22.8 (v2.22.8) # pin — аюулгүй байдлын хэрэгсэл @master-аас татагдах ёсгүй
        with:
          args: "-no-fail -fmt sarif -out gosec.sarif ./..."

      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif
          category: gosec

  # Регрессийн тор — Lab корпусыг ЭНЭ commit-ийн engine-ээр дахин тоглуулна.
  #
  # ЯАГААД: Tatar-Kuber-Lab бол регрессийн суурь, гэвч түүний өөрийн workflow нь
  # зөвхөн LAB руу push хийхэд ажилладаг. Өөрөөр хэлбэл engine дээрх өөрчлөлт
  # зураглал, dedup, rollup, оноолтыг эвдсэн ч Lab чимээгүй хэвээр үлддэг —
  # тор нь барих ёстой зүйлийнхээ хажууд биш газар өлгөөстэй байна гэсэн үг.
  #
  # Golden corpus (examples/demo) үүнийг орлохгүй: тэр бол engine дотор хөлдөөсөн
  # ЖИЖИГ корпус, Lab бол тусдаа, томоохон, бодит гаралтын цуглуулга. Хоёулаа
  # хэрэгтэй — нэг нь нөгөөгийнхөө сохор цэгийг хардаг.
  #
  # Унавал: гаралт Lab-ийн expected/expected-findings.json-оос зөрсөн гэсэн үг.
  # Өөрчлөлт зориуд бол Lab дээрх expected файлыг тусдаа PR-аар шинэчилнэ.
  # Энэ job-ыг алгасах нь зөв хариулт БИШ.
  lab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4

      - name: Checkout lab
        uses: actions/checkout@v4
        with:
          repository: ochmunkh/Tatar-Kuber-Lab
          path: lab

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true

      # Нийтлэгдсэн хувилбар биш, ЭНЭ commit-ээс барина — эс бөгөөс тест нь
      # өөрийгөө шалгахын оронд хуучин binary-г шалгана.
      - name: Build tatar-kuber from this commit
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          go build -o "$GITHUB_WORKSPACE/bin/tatar-kuber" ./cmd/tatar-kuber
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Run the lab (doctor · scan · report ×3 · gate · verify-lab)
        run: ./run-lab.sh
        working-directory: lab

      # verify-lab нь ТООНД тулгуурладаг: control-ийн олонлог ба severity тус
      # бүрийн тоо. Тиймээс нэг scanner-ийн хувь нэмэр БҮТЭН алга болохыг
      # (өөр scanner тэр control-ыг мөн хамарч байвал) барихгүй — яг v1.0.0-ийн
      # эвдрэл: Trivy юу ч оруулаагүй атлаа нийт тоо эрүүл харагдаж байсан.
      #
      # Энэ алхам тэр нүхийг хаана: scanner бүр ажиллаж, НЭГЭЭС ДЭЭШ олдвор
      # оруулсан байхыг шаардана. Яг тоог энд бичихгүй — тэр нь
      # expected-findings.json-ийг хоёр дахин бичсэнтэй адил болж хоёулаа
      # хоорондоо хоцорно. Энд шалгаж байгаа зүйл нь "хувь нэмэр БАЙНА уу"
      # гэдэг, "хэд вэ" гэдэг биш.
      #
      # Түр шийдэл: verify-lab өөрөө scanner тус бүрийн хүлээлтийг уншдаг
      # болоход энэ алхам тийш нүүнэ (BLOCKED.md-д бүртгэв).
      - name: Every scanner must have contributed something
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("lab/normalized/tatar-findings.json", encoding="utf-8"))
          runs = d.get("metadata", {}).get("scanner_runs") or []
          if not runs:
              sys.exit("metadata.scanner_runs хоосон — хамрах хүрээг шалгах боломжгүй")
          bad = []
          for r in runs:
              if r.get("status") not in ("ok", "ingested"):
                  bad.append(f"{r['scanner']}: status={r.get('status')}")
              elif not r.get("findings"):
                  bad.append(f"{r['scanner']}: 0 findings — хувь нэмэр чимээгүй алга болов")
          for r in runs:
              print(f"  {r['scanner']:<10} {r.get('status'):<10} findings={r.get('findings')}")
          if bad:
              sys.exit("ХАМРАХ ХҮРЭЭ БУУРСАН:\n  " + "\n  ".join(bad))
          print(f"{len(runs)} scanner бүгд хувь нэмэр оруулав")
          PY
