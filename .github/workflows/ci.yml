name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable" # patched stdlib (html/template XSS засварууд)
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      # CONTRIBUTING.md-д setup ба adapter нэмэх алхам хоёуланд шаардлагатай гэж
      # бичигдсэн байсан ч ямар ч workflow ажиллуулдаггүй байв → хэзээ ч
      # мөрдөгддөггүй шаардлага. Registry бол canonical гэрээ тул үргэлж шалгана.
      - name: Validate canonical registry
        run: python3 scripts/validate_registry.py

      # The .docx and the .md of each engineering document are BOTH committed
      # and either one may be edited (CONTRIBUTING.md), so the pair has to be
      # back in sync before merge. Checked by CONTENT — regenerate the Markdown
      # and compare — never by modification time: git does not store
      # timestamps, so after a fresh clone every file carries the checkout time
      # and an mtime comparison would pass or fail at random. Content also
      # catches the case that matters, a .md edited by hand.
      - name: Docs in sync (.docx -> .md)
        run: bash scripts/docs.sh --check

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # gosec SARIF-ийг Code Scanning руу upload
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable" # patched stdlib (html/template XSS засварууд)
          cache: true

      # Хамааралууд болон stdlib дахь мэдэгдэж буй CVE-г шалгана (нарийвчлалтай).
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      # Статик аюулгүй байдлын шинжилгээ (SAST). CI-г унагахгүй — үр дүнг Code Scanning-д мэдээлнэ.
      - name: gosec (SAST)
        uses: securego/gosec@v2.22.8 # pin — аюулгүй байдлын хэрэгсэл @master-аас татагдах ёсгүй
        with:
          args: "-no-fail -fmt sarif -out gosec.sarif ./..."

      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif
          category: gosec
