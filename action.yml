name: "TATAR-Kuber"
description: "Kubernetes security posture gate — Trivy · Kubescape · Checkov · Popeye нэг стандарт тайлан + CI gate + SARIF"
branding:
  icon: "shield"
  color: "green"

inputs:
  path:
    description: "Local manifest/Helm зам (Mode A static scan)"
    required: false
    default: "."
  raw-dir:
    description: "Урьдчилан цуглуулсан scanner raw JSON-уудын хавтас (offline ingest). Заавал бол path-г орлоно."
    required: false
    default: ""
  fail-on:
    description: "Gate severity босго: critical | high | medium | low. Хоосон бол .tatar-kuber.yaml (эсвэл default high)."
    required: false
    default: ""
  min-score:
    description: "Cluster score доод хязгаар. Хоосон бол .tatar-kuber.yaml-ын утга (0 = хэрэгсэхгүй)."
    required: false
    default: ""
  policy:
    description: ".tatar-kuber.yaml бодлогын файл"
    required: false
    default: ".tatar-kuber.yaml"
  version:
    description: "tatar-kuber хувилбар (go install tag). default: latest"
    required: false
    default: "latest"
  registry:
    description: "canonical-controls.yaml зам. Хоосон бол binary-д шигтгэсэн registry (ихэнх repo-д энэ л зөв)."
    required: false
    default: ""

outputs:
  sarif:
    description: "Үүсгэсэн SARIF файлын зам"
    value: ${{ steps.run.outputs.sarif }}
  result:
    description: "scan-result.json-ы зам"
    value: ${{ steps.run.outputs.result }}

runs:
  using: "composite"
  steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: "stable"

    - name: Run TATAR-Kuber
      id: run
      shell: bash
      # Оролтуудыг env-ээр дамжуулна (script injection-оос сэргийлнэ: ${{ }} нь shell рүү шууд орохгүй).
      env:
        IN_PATH: ${{ inputs.path }}
        IN_RAW_DIR: ${{ inputs.raw-dir }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_MIN_SCORE: ${{ inputs.min-score }}
        IN_POLICY: ${{ inputs.policy }}
        IN_VERSION: ${{ inputs.version }}
        IN_REGISTRY: ${{ inputs.registry }}
      run: |
        set -euo pipefail
        go install "github.com/ochmunkh/tatar-kuber/cmd/tatar-kuber@${IN_VERSION}"
        BIN="$(go env GOPATH)/bin/tatar-kuber"
        mkdir -p tatar-out

        REG=()
        [ -n "$IN_REGISTRY" ] && REG=(--registry "$IN_REGISTRY")

        if [ -n "$IN_RAW_DIR" ]; then
          "$BIN" scan --raw-dir "$IN_RAW_DIR" -o tatar-out ${REG[@]+"${REG[@]}"}
        else
          "$BIN" scan -f "$IN_PATH" -o tatar-out ${REG[@]+"${REG[@]}"}
        fi

        "$BIN" report --input tatar-out/scan-result.json -o sarif --out tatar-out/tatar-kuber.sarif
        echo "sarif=tatar-out/tatar-kuber.sarif" >> "$GITHUB_OUTPUT"
        echo "result=tatar-out/scan-result.json" >> "$GITHUB_OUTPUT"

        # Gate — босго давбал энэ алхам exit 1 буцааж workflow-г унагана.
        # fail-on / min-score-ыг ЗӨВХӨН өгсөн үед дамжуулна → .tatar-kuber.yaml утга хүчинтэй үлдэнэ.
        GATE=(--input tatar-out/scan-result.json --policy "$IN_POLICY")
        [ -n "$IN_FAIL_ON" ] && GATE+=(--fail-on "$IN_FAIL_ON")
        [ -n "$IN_MIN_SCORE" ] && GATE+=(--min-score "$IN_MIN_SCORE")
        "$BIN" gate "${GATE[@]}"
