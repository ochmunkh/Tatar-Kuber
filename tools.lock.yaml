# tools.lock.yaml — the default scanner pins shipped with TATAR-Kuber.
#
# Copy this to ~/.tatar-kuber/tools.lock.yaml (or point --home at a directory
# containing it) and `tatar-kuber update` will install exactly these releases.
# `update` rewrites the copy it uses, adding an `installed:` line per scanner;
# this file is the reviewed starting point, not that working copy.
#
#   version    the release to install
#   sha256     the checksum of the DOWNLOADED ARTEFACT (archive or bare binary),
#              KEYED BY PLATFORM, as the upstream project publishes it.
#              `update` refuses to install a scanner that has no pin for the
#              platform it is running on.
#   cosign     "unverified" — signature checking is not implemented yet, so
#              this file never says "verified".
#
# PROVENANCE — how each checksum below was obtained, on 2026-10-18:
#
#   1. the release's own published checksum file was downloaded:
#        trivy      trivy_0.74.0_checksums.txt
#        kubescape  checksums.sha256
#        popeye     checksums.sha256
#   2. the line for each platform's artefact was read out of it
#
# No checksum here was computed from a local download. A hash taken from a file
# you already have proves only that it did not change on its way to you; the
# value has to come from what the project itself published.
#
# WHY PER PLATFORM: a release publishes a DIFFERENT artefact per platform, so a
# single checksum pins exactly one of them. Until 2026-10-18 this file carried
# one value per scanner — correct on linux/amd64, and a MISMATCH everywhere
# else, which read as a corrupt download rather than as an unpinned platform.
#
# checkov is deliberately unpinned: bridgecrewio publishes no checksum file, no
# signature and no build attestation for its release archives, so there is
# nothing to check against. `update` refuses it rather than installing a binary
# it cannot verify. See BLOCKED.md.

